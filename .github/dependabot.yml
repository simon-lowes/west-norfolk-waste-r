version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
      semver-major-days: 7
      semver-minor-days: 5
      semver-patch-days: 3
    ignore:
      # Pinned by Expo SDK 54 — native code bundled in Expo Go.
      # These can only move when upgrading the Expo SDK itself.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-svg"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@types/react"
      # Expo's `expo install --check` pins typescript to a specific minor.
      # Only bump major TS versions when upgrading the Expo SDK itself.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
